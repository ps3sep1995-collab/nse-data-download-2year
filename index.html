<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE F&O Delivery High/Low Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DataTables CSS & JS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        table.dataTable { width: 100% !important; margin: 0 !important; table-layout: fixed; }
        th, td { padding: 8px 4px !important; font-size: 10px !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th:nth-child(1), td:nth-child(1) { width: 25%; text-align: left; }
        th:nth-child(2), td:nth-child(2) { width: 22%; text-align: right; }
        th:nth-child(3), td:nth-child(3) { width: 20%; text-align: right; }
        th:nth-child(4), td:nth-child(4) { width: 15%; text-align: right; }
        th:nth-child(5), td:nth-child(5) { width: 18%; text-align: center; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans leading-relaxed">

    <div class="max-w-4xl mx-auto px-2 py-3">
        <!-- Header & Date Picker -->
        <header class="mb-3 border-b border-slate-800 pb-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-sm font-bold tracking-tight text-emerald-400">NSE F&O Delivery High/Low Dashboard</h1>
                <p class="text-slate-400 text-[10px]">Volume High & Low Trend Matrix</p>
            </div>
            
            <div class="flex items-center gap-1.5 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 shadow w-full sm:w-auto">
                <label for="bhav-date" class="text-[10px] uppercase tracking-wider text-slate-400 font-medium">Date:</label>
                <input type="date" id="bhav-date" class="bg-slate-900 text-emerald-400 text-xs px-1.5 py-0.5 rounded border border-slate-600 focus:outline-none font-semibold flex-1 sm:flex-none">
                <button id="load-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold px-2.5 py-1 rounded shadow">Load</button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="mb-2">
            <input type="text" id="stock-search" placeholder="Search Symbol (e.g. RELIANCE)..." class="w-full bg-slate-800 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-emerald-500 uppercase font-semibold placeholder:normal-case placeholder:text-slate-500 shadow">
        </div>

        <!-- Data Table Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-2 shadow-lg overflow-hidden">
            <table id="deliveryTable" class="w-full text-slate-300 display stripe">
                <thead class="bg-slate-700/50 text-[10px] uppercase text-slate-400">
                    <tr>
                        <th class="text-left">Symbol</th>
                        <th class="text-right">Deliv Qty</th>
                        <th class="text-right">5D Avg</th>
                        <th class="text-right">Ratio %</th>
                        <th class="text-center">Trend / Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let tableInstance = null;
        let globalData = {};

        async function loadDashboardData() {
            renderMessage("डेटा लोड हो रहा है...");
            try {
                let res = await fetch('dashboard_data.json');
                if (!res.ok) throw new Error("JSON file not found");
                globalData = await res.json();
                
                let availableDates = Object.keys(globalData).sort();
                
                if (availableDates.length > 0) {
                    let latestDate = availableDates[availableDates.length - 1];
                    document.getElementById('bhav-date').value = latestDate;
                    renderTableForDate(latestDate);
                } else {
                    renderMessage("JSON फाइल खाली है।");
                }
            } catch (e) {
                renderMessage("error: dashboard_data.json लोड नहीं हो पा रही है। कृपया backtest.py रन करें।");
            }
        }

        function renderTableForDate(dateStr) {
            let rows = globalData[dateStr] || [];

            if ($.fn.DataTable.isDataTable('#deliveryTable')) {
                $('#deliveryTable').DataTable().clear().destroy();
            }

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-slate-400">तारीख ${dateStr} के लिए कोई डेटा उपलब्ध नहीं है।</td></tr>`;
            } else {
                rows.sort((a, b) => b.ratioPct - a.ratioPct);

                rows.forEach(r => {
                    // Highs के लिए हरे/सुनहरे रंग, Lows के लिए लाल रंग के बैज
                    let badgeClass = "text-slate-400 bg-slate-800";
                    if (r.breakout === '1M High') {
                        badgeClass = "text-amber-300 bg-amber-950/70 border border-amber-600/50 font-bold px-1.5 py-0.5 rounded";
                    } else if (r.breakout === '2W High') {
                        badgeClass = "text-purple-300 bg-purple-950/70 border border-purple-600/50 font-bold px-1.5 py-0.5 rounded";
                    } else if (r.breakout === '1W High') {
                        badgeClass = "text-emerald-300 bg-emerald-950/70 border border-emerald-600/50 font-bold px-1.5 py-0.5 rounded";
                    } else if (r.breakout === '1M Low') {
                        badgeClass = "text-rose-300 bg-rose-950/70 border border-rose-600/50 font-bold px-1.5 py-0.5 rounded";
                    } else if (r.breakout === '2W Low') {
                        badgeClass = "text-pink-300 bg-pink-950/70 border border-pink-600/50 font-bold px-1.5 py-0.5 rounded";
                    } else if (r.breakout === '1W Low') {
                        badgeClass = "text-orange-300 bg-orange-950/70 border border-orange-600/50 font-bold px-1.5 py-0.5 rounded";
                    }

                    tbody.innerHTML += `
                        <tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
                            <td class="font-semibold text-white">${r.symbol}</td>
                            <td class="text-right text-slate-300">${r.delivQty.toLocaleString('en-IN')}</td>
                            <td class="text-right text-slate-400">${r.avg5Qty.toLocaleString('en-IN')}</td>
                            <td class="text-right font-bold text-cyan-400">${r.ratioPct.toFixed(2)}%</td>
                            <td class="text-center"><span class="inline-block text-[9px] ${badgeClass}">${r.breakout}</span></td>
                        </tr>
                    `;
                });

                tableInstance = $('#deliveryTable').DataTable({
                    paging: false,
                    searching: false,
                    info: false,
                    order: [[3, "desc"]]
                });
            }
        }

        function renderMessage(msg) {
            if ($.fn.DataTable.isDataTable('#deliveryTable')) {
                $('#deliveryTable').DataTable().clear().destroy();
            }
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-slate-400">${msg}</td></tr>`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
        });

        document.getElementById('load-btn').addEventListener('click', () => {
            const dt = document.getElementById('bhav-date').value;
            if (dt) {
                if (globalData[dt]) {
                    renderTableForDate(dt);
                } else {
                    renderMessage(`तारीख ${dt} के लिए कोई डेटा नहीं मिला (बाजार बंद हो सकता है)।`);
                }
            }
        });

        $('#stock-search').on('keyup', function() {
            if (tableInstance) {
                tableInstance.columns(0).search(this.value).draw();
            }
        });
    </script>
</body>
</html>
