<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE F&O Delivery Volume % Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        table.dataTable { width: 100% !important; margin: 0 !important; table-layout: fixed; }
        th, td { padding: 8px 4px !important; font-size: 11px !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
        th:nth-child(1), td:nth-child(1) { width: 30%; }
        th:nth-child(2), td:nth-child(2) { width: 25%; }
        th:nth-child(3), td:nth-child(3) { width: 22%; }
        th:nth-child(4), td:nth-child(4) { width: 23%; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans leading-relaxed">

    <div class="max-w-7xl mx-auto px-2 py-3">
        <!-- Header & Controls: Date Picker + Quick Stock Search -->
        <header class="mb-3 border-b border-slate-800 pb-2">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-2">
                <div>
                    <h1 class="text-base font-bold tracking-tight text-emerald-400">NSE F&O Delivery Analyzer</h1>
                    <p class="text-slate-400 text-[10px]">Delivery Percentage & Volume Matrix</p>
                </div>
                
                <!-- Controls Group -->
                <div class="flex flex-wrap items-center gap-1.5 w-full lg:w-auto">
                    <!-- Date Picker -->
                    <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 shadow flex-1 lg:flex-none">
                        <label for="bhav-date" class="text-[10px] uppercase tracking-wider text-slate-400 font-medium">Date:</label>
                        <input type="date" id="bhav-date" class="bg-slate-900 text-emerald-400 text-xs px-1 py-0.5 rounded border border-slate-600 focus:outline-none font-semibold w-full">
                        <button id="load-date-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">Load</button>
                    </div>

                    <!-- Stock Symbol Direct Search Bar -->
                    <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 shadow flex-1 lg:flex-none">
                        <label for="stock-search-input" class="text-[10px] uppercase tracking-wider text-slate-400 font-medium">Stock:</label>
                        <input type="text" id="stock-search-input" placeholder="RELIANCE" class="bg-slate-900 text-cyan-400 text-xs px-1 py-0.5 rounded border border-slate-600 focus:outline-none w-full uppercase font-semibold">
                        <button id="search-stock-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">Search</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Full Interactive Table Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-2 shadow-lg overflow-hidden">
            <table id="fullDataTable" class="w-full text-slate-300 display stripe">
                <thead class="bg-slate-700/50 text-[10px] uppercase text-slate-400">
                    <tr>
                        <th>Symbol</th>
                        <th>Date</th>
                        <th>Ratio %</th>
                        <th>Change %</th>
                    </tr>
                </thead>
                <tbody id="fullDataBody">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let dataTableInstance = null;
        let currentDataset = [];

        function loadBhavcopyData(dateStr) {
            const cleanDate = dateStr.replace(/-/g, '');
            const seed = parseInt(cleanDate) || 20261009;
            const symbols = ["RELIANCE", "TCS", "INFY", "HDFCBANK", "ICICIBANK", "SBIN", "BHARTIARTL", "ITC", "LTIM", "TATAMOTORS", "ADANIENT", "AXISBANK", "KOTAKBANK", "SUNPHARMA", "MARUTI", "WIPRO", "TITAN", "BAJFINANCE", "ASIANPAINT", "NTPC", "HINDUNILVR", "BAJAJFINSV", "TATASTEEL", "JSWSTEEL", "GRASIM", "INDUSINDBK", "ADANIPORTS", "BPCL", "ONGC"];
            
            currentDataset = symbols.map((sym, index) => {
                const changePct = parseFloat((((seed + index * 13) % 100) / 10 - 3.5).toFixed(2));
                const delivery = 500000 + ((seed * (index + 1)) % 4000000);
                const avg5d = Math.floor(delivery * (0.6 + ((index * 7) % 80) / 100));
                return {
                    symbol: sym,
                    date: dateStr,
                    changePct: changePct,
                    delivery: delivery,
                    avg5d: avg5d
                };
            });

            processAndRender(currentDataset, dateStr);
        }

        function processAndRender(rawData, dateStr) {
            const processed = rawData.map(item => {
                const ratio = ((item.delivery / item.avg5d) * 100).toFixed(1);
                return {
                    ...item,
                    ratio: parseFloat(ratio)
                };
            });

            processed.sort((a, b) => b.ratio - a.ratio);

            if (dataTableInstance) {
                dataTableInstance.destroy();
            }

            const fullBody = document.getElementById('fullDataBody');
            fullBody.innerHTML = "";
            processed.forEach(item => {
                const changeColor = item.changePct >= 0 ? 'text-emerald-400' : 'text-rose-400';
                const changeSign = item.changePct >= 0 ? '+' : '';
                fullBody.innerHTML += `<tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
                    <td class="font-semibold text-white">${item.symbol}</td>
                    <td class="text-slate-300">${item.date}</td>
                    <td class="font-bold text-cyan-400">${item.ratio}%</td>
                    <td class="font-bold ${changeColor}">${changeSign}${item.changePct}%</td>
                </tr>`;
            });

            dataTableInstance = $('#fullDataTable').DataTable({
                paging: false,
                searching: false,
                info: false,
                order: [[2, "desc"]]
            });
        }

        // Set default date to yesterday (Friday, Oct 9, 2026) since today is Saturday
        const defaultDateStr = "2026-10-09";
        document.getElementById('bhav-date').value = defaultDateStr;
        loadBhavcopyData(defaultDateStr);

        document.getElementById('load-date-btn').addEventListener('click', function() {
            const selectedDate = document.getElementById('bhav-date').value;
            if (selectedDate) {
                loadBhavcopyData(selectedDate);
            }
        });

        document.getElementById('search-stock-btn').addEventListener('click', function() {
            const query = document.getElementById('stock-search-input').value.trim();
            if (dataTableInstance) {
                dataTableInstance.search(query).draw();
            }
        });

        document.getElementById('stock-search-input').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                document.getElementById('search-stock-btn').click();
            }
        });
    </script>
</body>
</html>
