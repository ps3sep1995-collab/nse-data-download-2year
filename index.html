<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE F&O Delivery Volume Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DataTables CSS & JS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        table.dataTable { width: 100% !important; margin: 0 !important; table-layout: fixed; }
        th, td { padding: 8px 6px !important; font-size: 11px !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th:nth-child(1), td:nth-child(1) { width: 35%; text-align: left; }
        th:nth-child(2), td:nth-child(2) { width: 30%; text-align: right; }
        th:nth-child(3), td:nth-child(3) { width: 35%; text-align: right; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans leading-relaxed">

    <div class="max-w-4xl mx-auto px-2 py-3">
        <!-- Header & Date Picker -->
        <header class="mb-3 border-b border-slate-800 pb-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-sm font-bold tracking-tight text-emerald-400">NSE F&O Delivery Dashboard</h1>
                <p class="text-slate-400 text-[10px]">F&O Stocks Delivery Volume Matrix</p>
            </div>
            
            <div class="flex items-center gap-1.5 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 shadow w-full sm:w-auto">
                <label for="bhav-date" class="text-[10px] uppercase tracking-wider text-slate-400 font-medium">Date:</label>
                <input type="date" id="bhav-date" class="bg-slate-900 text-emerald-400 text-xs px-1.5 py-0.5 rounded border border-slate-600 focus:outline-none font-semibold flex-1 sm:flex-none">
                <button id="load-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold px-2.5 py-1 rounded shadow">Load</button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="mb-2">
            <input type="text" id="stock-search" placeholder="Search Symbol (e.g. RELIANCE)..." class="w-full bg-slate-800 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-emerald-500 uppercase font-semibold placeholder:normal-case placeholder:text-slate-500 shadow">
        </div>

        <!-- Data Table Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-2 shadow-lg overflow-hidden">
            <table id="deliveryTable" class="w-full text-slate-300 display stripe">
                <thead class="bg-slate-700/50 text-[10px] uppercase text-slate-400">
                    <tr>
                        <th class="text-left">Symbol</th>
                        <th class="text-right">Deliv Qty</th>
                        <th class="text-right">% to Traded Qty</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let tableInstance = null;
        let foSymbols = new Set();

        // 1. fo_symbols.txt लोड करें
        async function loadFoSymbols() {
            try {
                const res = await fetch('fo_symbols.txt');
                if (res.ok) {
                    const text = await res.text();
                    text.split('\n').forEach(s => {
                        const sym = s.trim().toUpperCase();
                        if (sym) foSymbols.add(sym);
                    });
                }
            } catch (e) {
                console.warn("Could not load fo_symbols.txt");
            }
        }

        // 2. चुनी गई तारीख की Bhavcopy CSV फाइल लोड करें
        async function loadDataForDate(dateStr) {
            const cleanDate = dateStr.replace(/-/g, '');
            const csvPath = `nse_bhavcopies/sec_bhavdata_${cleanDate}.csv`;

            try {
                const res = await fetch(csvPath);
                if (!res.ok) throw new Error("File not found");
                const csvText = await res.text();
                parseAndRender(csvText, dateStr);
            } catch (err) {
                renderMessage(`तारीख ${dateStr} के लिए कोई डेटा उपलब्ध नहीं है।`);
            }
        }

        // 3. CSV पार्स करके F&O स्टॉक्स दिखाना
        function parseAndRender(csvText, dateStr) {
            const lines = csvText.split('\n');
            const rows = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                if (cols.length > 13) {
                    const symbol = cols[0];
                    const series = cols[1];

                    // केवल F&O लिस्ट वाले और EQ सीरीज के शेयर लें
                    if (series === 'EQ' && (foSymbols.size === 0 || foSymbols.has(symbol))) {
                        const delivQty = parseFloat(cols[12]) || 0;
                        const delivPct = parseFloat(cols[13]) || 0;

                        rows.push({
                            symbol: symbol,
                            delivQty: delivQty,
                            delivPct: delivPct
                        });
                    }
                }
            }

            // डिलीवरी प्रतिशत के हिसाब से डिसेंडिंग सॉर्ट करें
            rows.sort((a, b) => b.delivPct - a.delivPct);

            if (tableInstance) {
                tableInstance.destroy();
            }

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-slate-400">इस दिन कोई F&O डेटा नहीं मिला।</td></tr>`;
            } else {
                rows.forEach(r => {
                    tbody.innerHTML += `
                        <tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
                            <td class="font-semibold text-white">${r.symbol}</td>
                            <td class="text-right text-slate-300">${r.delivQty.toLocaleString('en-IN')}</td>
                            <td class="text-right font-bold text-cyan-400">${r.delivPct.toFixed(2)}%</td>
                        </tr>
                    `;
                });
            }

            tableInstance = $('#deliveryTable').DataTable({
                paging: false,
                searching: true,
                info: false,
                order: [[2, "desc"]]
            });
            
            // कस्टम सर्च इनपुट को DataTables से जोड़ें
            $('#stock-search').on('keyup', function() {
                tableInstance.search(this.value).draw();
            });
        }

        function renderMessage(msg) {
            if (tableInstance) tableInstance.destroy();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-slate-400">${msg}</td></tr>`;
            tableInstance = $('#deliveryTable').DataTable({ paging: false, searching: false, info: false });
        }

        // पेज लोड पर इनिशियलाइज़ेशन
        window.addEventListener('DOMContentLoaded', async () => {
            await loadFoSymbols();
            
            // डिफ़ॉल्ट रूप से आज की या हालिया तारीख सेट करें
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('bhav-date').value = "2024-10-10"; // आपकी उपलब्ध तारीख के अनुसार
            loadDataForDate(document.getElementById('bhav-date').value);
        });

        document.getElementById('load-btn').addEventListener('click', () => {
            const dt = document.getElementById('bhav-date').value;
            if (dt) loadDataForDate(dt);
        });
    </script>
</body>
</html>
