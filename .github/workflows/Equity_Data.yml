name: Auto Download Equity_Data_Download

on:
  schedule:
    # अब यह हर दिन (सोमवार से रविवार) शाम को 6:30 बजे (IST) ऑटोमैटिक रन होगा
    - cron: '30 13 * * *'
  workflow_dispatch: # इससे आप चाहें तो कभी भी मैन्युअली भी रन कर सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run Downloader Script
      run: python Equity_Data_Download.py

    - name: Commit and push changes back to repo
      uses: stefanzweifel/git-auto-commit-action@v4
        branch: main
        create_branch_for_ci_updates: false
    permissions:
      contents: write
