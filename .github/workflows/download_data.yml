name: Download NSE Equity Data

on:
  schedule:
    # अब यह हर दिन (सोमवार से रविवार) शाम को 6:30 बजे (IST) ऑटोमैटिक रन होगा
    - cron: '30 13 * * *'
  workflow_dispatch: # इससे आप चाहें तो कभी भी मैन्युअली भी रन कर सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run download script
      run: python main.py

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add Equity/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NSE Equity data" && git push)
